name: Release provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:supply-chain
      - name: Package the verified application
        run: >-
          tar --create --gzip --file "plenum-platform-${GITHUB_SHA}.tar.gz"
          package.json package-lock.json deploy apps/server/dist apps/runtime-web/dist apps/studio/dist packages/*/dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: plenum-platform-${{ github.sha }}.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: plenum-platform-${{ github.sha }}.tar.gz
          sbom-path: test-results/supply-chain/sbom.cdx.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: plenum-release-${{ github.sha }}
          path: |
            plenum-platform-${{ github.sha }}.tar.gz
            test-results/supply-chain/
          if-no-files-found: error
          retention-days: 90
