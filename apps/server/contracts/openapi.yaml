        targetStateVariableId: { type: string, minLength: 1 }
        scopeReference: { type: string }
        operation: { type: string, enum: [set, adjust] }
        value: {}
        rationale: { type: string, minLength: 1 }
        status: { type: string, enum: [staged, in_review, applied, rejected, returned, stale, failed] }
        expectedStateVersion: { type: integer, minimum: 0 }
        governingReleaseId: { type: string, format: uuid }
        authorityEpoch: { type: integer, minimum: 1 }
        pluginDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        configurationDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        inputDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        outputDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        version: { type: integer, minimum: 1 }
    RuntimeDeltaV1:
      type: object
      additionalProperties: false
      required: [deltaId, cursor, eventType, aggregateId, aggregateVersion, occurredAt, payload]
      properties:
        deltaId: { type: string, format: uuid }
        cursor: { type: string, format: uuid }
        eventType: { type: string, pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$" }
        aggregateId: { type: string, format: uuid }
        aggregateVersion: { type: [integer, "null"], minimum: 0 }
        occurredAt: { type: string, format: date-time }
