        version: { type: integer, minimum: 1 }
        governingReleaseId: { type: string, format: uuid }
        deadlineAt: { type: [string, "null"], format: date-time }
        eligible: { type: boolean }
        hasVoted: { type: boolean }
        ballotCapability: { type: [string, "null"], format: uuid }
        receipt: { type: [object, "null"] }
        canManage: { type: boolean }
        canCertify: { type: boolean }
        tally: { type: [object, "null"] }
        certification: { type: [object, "null"] }
    OperatorProjectionV1:
      type: object
