openapi: 3.1.0
info:
  title: Plenum platform API
  version: 0.1.0
paths:
  /v1/projects/{projectId}/releases:
    post:
      operationId: publishRelease
      x-contract-id: release-manifest-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishReleaseRequestV1" }
      responses:
        "201":
          description: Immutable Definition Revision, Release, and portable Package created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedReleaseV1" }
        "403": { description: Publisher authority is absent or revoked. }
        "409": { description: Draft changed or identical content was already published. }
  /v1/releases/{releaseId}/package:
    get:
      operationId: exportReleasePackage
      x-contract-id: package-import-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Canonical Package bytes verified against the stored digest.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Release is absent from the authenticated Organization. }
  /v1/packages/import:
    post:
      operationId: importReleasePackage
      x-contract-id: package-import-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: header
          name: X-Package-SHA256
          required: true
          schema: { type: string, pattern: "^sha-256=[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Verified Package imported or matched idempotently to its existing Release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedReleaseV1" }
        "400": { description: Package digest or compatibility verification failed. }
        "403": { description: Publisher authority is absent or revoked. }
  /v1/sessions/{sessionId}/commands:
    post:
      operationId: processSessionCommand
      x-contract-id: artifact-command-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandEnvelopeV1" }
      responses:
        "200":
          description: Accepted or idempotently replayed recorded outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceiptV1" }
        "409":
          description: Rejected or reconciliation-required recorded outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceiptV1" }
        "503": { description: Deployment or Authority Epoch is not authoritative; no receipt is written. }
  /v1/sessions/{sessionId}/commands/{commandId}:
    get:
      operationId: getCommandReceipt
      x-contract-id: command-receipt-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: commandId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's original durable Command Receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceiptV1" }
        "404": { description: Missing and unauthorized receipts share NOT_FOUND semantics. }
  /v1/devices:
    post:
      operationId: registerDevice
      security: [{ SessionCookie: [] }]
      responses:
        "201":
          description: A Device registered to the authenticated Person.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deviceId]
                properties:
                  deviceId: { type: string, format: uuid }
  /v1/sessions/{sessionId}/runtime-projection:
    get:
      operationId: getRuntimeInterfaceProjection
      x-contract-id: runtime-projection-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Release-driven, server-authorized Runtime interface and task projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeProjectionV1" }
        "403": { description: Participant, Device, Seat Assignment, or Interface Profile is not authorized. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
  /v1/operator/sessions/{sessionId}:
    get:
      operationId: getOperatorProjection
      x-contract-id: operator-projection-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authoritative Session summary for an Organization Operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorProjectionV1" }
        "403": { description: The authenticated Principal is not an Operator. }
  /v1/sessions/{sessionId}/sync/stream:
    get:
      operationId: streamRuntimeDeltas
      x-contract-id: runtime-sse-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Last-Event-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized at-least-once Runtime deltas; each SSE ID is an opaque Projection Cursor.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
        "409": { description: Projection Cursor expired or its access policy changed; fetch a snapshot. }
  /v1/sessions/{sessionId}/sync/deltas:
    get:
      operationId: getRuntimeDeltas
      x-contract-id: sync-deltas-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bounded ordered authorized deltas for restrictive-network polling fallback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDeltasV1" }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
        "409": { description: Projection Cursor expired or its access policy changed; fetch a snapshot. }
  /v1/sessions/{sessionId}/sync/snapshot:
    get:
      operationId: getRuntimeSnapshot
      x-contract-id: sync-snapshot-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Fresh authorized Runtime Projection with policy and projection versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncSnapshotV1" }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
  /v1/auth/oidc/{providerKey}/begin:
    post:
      operationId: beginOidcLogin
      security: []
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Server-created OIDC authorization request using state, nonce and PKCE.
  /v1/auth/oidc/{providerKey}/callback:
    get:
      operationId: completeOidcLogin
      x-contract-id: oidc-callback-v1
      security: []
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: code
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: state
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: Authentication Session established in a Secure, HttpOnly cookie. }
        "401": { description: Invalid or expired identity response. }
  /v1/sessions/{sessionId}/access-context:
    get:
      operationId: getSessionAccessContext
      x-contract-id: session-access-context-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Server-derived Session Access Context. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
components:
  schemas:
    PublishReleaseRequestV1:
      type: object
      additionalProperties: false
      required: [releaseLabel, semanticVersion, methodologyVersion, releaseNotes, controls]
      properties:
        releaseLabel: { type: string, minLength: 1 }
        semanticVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        methodologyVersion: { type: string, minLength: 1 }
        releaseNotes: { type: string }
        controls:
          type: object
          additionalProperties: false
          required: [validationReportId, validationPassed, warningsAcknowledged, classificationReviewId, accessibilityReviewStatus, retentionPolicyId, approvedBy, approvalNotes]
          properties:
            validationReportId: { type: string, format: uuid }
            validationPassed: { const: true }
            warningsAcknowledged: { const: true }
            classificationReviewId: { type: string, minLength: 1 }
            accessibilityReviewStatus: { type: string, minLength: 1 }
            retentionPolicyId: { type: string, minLength: 1 }
            approvedBy: { type: array, minItems: 1, items: { type: string, format: uuid } }
            approvalNotes: { type: string }
            testSessionPassed: { type: boolean }
    PublishedReleaseV1:
      type: object
      additionalProperties: false
      required: [releaseId, definitionRevisionId, releaseLabel, contentDigest, manifestDigest, packageDigest]
      properties:
        releaseId: { type: string, format: uuid }
        definitionRevisionId: { type: string, format: uuid }
        releaseLabel: { type: string }
        contentDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        manifestDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        packageDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        imported: { type: boolean }
    CommandEnvelopeV1:
      type: object
      additionalProperties: false
      required: [commandId, deviceId, operationType, aggregateId, expectedAggregateVersion, governingReleaseId, payload]
      properties:
        commandId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        operationType: { type: string, pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$" }
        aggregateId: { type: string, format: uuid }
        expectedAggregateVersion: { type: integer, minimum: 0 }
        governingReleaseId: { type: string, format: uuid }
        activeSessionRoleId: { type: string, minLength: 1 }
        deviceObservedAt: { type: string, format: date-time }
        payload: { type: object }
    CommandReceiptV1:
      type: object
      additionalProperties: false
      required: [commandId, status, aggregateVersion, evidenceSequence, errorCode, message, replayed]
      properties:
        commandId: { type: string, format: uuid }
        status: { type: string, enum: [received, accepted, rejected, needs_reconciliation] }
        aggregateVersion: { type: [integer, "null"], minimum: 0 }
        evidenceSequence: { type: [integer, "null"], minimum: 1 }
        errorCode: { type: [string, "null"] }
        message: { type: [string, "null"] }
        replayed: { type: boolean }
    RuntimeFormFieldV1:
      type: object
      additionalProperties: false
      required: [key, label, type, required]
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        type: { type: string, enum: [text, long_text] }
        required: { type: boolean }
        helpText: { type: string }
    RuntimeFormV1:
      type: object
      additionalProperties: false
      required: [id, name, formVersion, fields]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        formVersion: { type: string, minLength: 1 }
        fields: { type: array, items: { $ref: "#/components/schemas/RuntimeFormFieldV1" } }
    RuntimeActionV1:
      type: object
      additionalProperties: false
      required: [operationType, label, requiresForm]
      properties:
        operationType: { type: string, pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$" }
        label: { type: string, minLength: 1 }
        requiresForm: { type: boolean }
    RuntimeArtifactV1:
      type: object
      additionalProperties: false
      required: [id, artifactTypeKey, title, state, stateLabel, payload, version, governingReleaseId, form, createdByMe, actions]
      properties:
        id: { type: string, format: uuid }
        artifactTypeKey: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        stateLabel: { type: string, minLength: 1 }
        payload: { type: object }
        version: { type: integer, minimum: 1 }
        governingReleaseId: { type: string, format: uuid }
        form: { $ref: "#/components/schemas/RuntimeFormV1" }
        createdByMe: { type: boolean }
        actions: { type: array, items: { $ref: "#/components/schemas/RuntimeActionV1" } }
    RuntimeProjectionV1:
      type: object
      additionalProperties: false
      required: [contractId, sessionId, sessionStatus, releaseId, releaseLabel, participantId, activeSessionRoleId, activeSessionRoleLabel, currentStageId, currentStageLabel, interfaceProfileId, layout, modules, createTasks, artifacts]
      properties:
        contractId: { const: runtime-projection-v1 }
        sessionId: { type: string, format: uuid }
        sessionStatus: { type: string, minLength: 1 }
        releaseId: { type: string, format: uuid }
        releaseLabel: { type: string, minLength: 1 }
        participantId: { type: string, format: uuid }
        activeSessionRoleId: { type: string, minLength: 1 }
        activeSessionRoleLabel: { type: string, minLength: 1 }
        currentStageId: { type: [string, "null"] }
        currentStageLabel: { type: [string, "null"] }
        interfaceProfileId: { type: string, minLength: 1 }
        layout: { type: string, enum: [single_column, main_with_sidebar, dashboard_grid, workspace_tabs] }
        modules: { type: array, items: { type: object } }
        createTasks: { type: array, items: { type: object } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/RuntimeArtifactV1" } }
    OperatorProjectionV1:
      type: object
      additionalProperties: false
      required: [contractId, sessionId, sessionStatus, releaseId, releaseLabel, participantCount, occupiedSeatCount, artifactsByState, activeTasks, recentEvents]
      properties:
        contractId: { const: operator-projection-v1 }
        sessionId: { type: string, format: uuid }
        sessionStatus: { type: string, minLength: 1 }
        releaseId: { type: string, format: uuid }
        releaseLabel: { type: string, minLength: 1 }
        participantCount: { type: integer, minimum: 0 }
        occupiedSeatCount: { type: integer, minimum: 0 }
        artifactsByState: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        activeTasks: { type: array, items: { type: object } }
        recentEvents: { type: array, items: { type: object } }
    RuntimeDeltaV1:
      type: object
      additionalProperties: false
      required: [deltaId, cursor, eventType, aggregateId, aggregateVersion, occurredAt, payload]
      properties:
        deltaId: { type: string, format: uuid }
        cursor: { type: string, format: uuid }
        eventType: { type: string, pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$" }
        aggregateId: { type: string, format: uuid }
        aggregateVersion: { type: [integer, "null"], minimum: 0 }
        occurredAt: { type: string, format: date-time }
        payload: { type: object }
    SyncDeltasV1:
      type: object
      additionalProperties: false
      required: [projectionVersion, policyVersion, deltas, nextCursor]
      properties:
        projectionVersion: { const: runtime-projection-v1 }
        policyVersion: { type: string, minLength: 1 }
        deltas: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/RuntimeDeltaV1" } }
        nextCursor: { type: string, format: uuid }
    SyncSnapshotV1:
      type: object
      additionalProperties: false
      required: [projectionVersion, policyVersion, cursor, state, aggregateVersions]
      properties:
        projectionVersion: { const: runtime-projection-v1 }
        policyVersion: { type: string, minLength: 1 }
        cursor: { type: string, format: uuid }
        state: { type: object }
        aggregateVersions:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
  securitySchemes:
    InstitutionalOidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example/.well-known/openid-configuration
      description: The actual issuer and discovery URL come only from trusted server configuration.
    SessionCookie:
      type: apiKey
      in: cookie
      name: plenum_session
      description: Opaque server Authentication Session identifier; Secure, HttpOnly and SameSite.
