        "200": { description: Session archived while retained records remain immutable and auditable. }
  /v1/sessions/{sessionId}/delete:
    post:
      operationId: logicallyDeleteSession
      x-contract-id: session-onboarding-v1
      x-command-operation: session.delete
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Archived Session authority fenced and access revoked; evidence and audit records retained. }
        "409": { description: Session must be archived before logical deletion. }
  /v1/sessions/{sessionId}/seat-assignments/{seatAssignmentId}/reassign:
    post:
      operationId: reassignSessionSeat
      x-contract-id: session-onboarding-v1
      x-command-operation: participant.reassign
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: seatAssignmentId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Old assignment closed and replacement opened in one transaction. }
        "409": { description: Assignment version is stale or destination Seat is occupied. }
  /v1/sessions/{sessionId}/guests:
    post:
      operationId: createSessionGuest
      x-contract-id: session-onboarding-v1
      x-command-operation: guest_identity.create
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Expiring Session-scoped Guest Identity created. }
  /v1/sessions/{sessionId}/display-principals/activate:
    post:
      operationId: activateSessionDisplayPrincipal
      x-contract-id: session-onboarding-v1
      x-command-operation: display_principal.activate
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Short-lived read-only Display Principal credential returned once. }
  /v1/sessions/{sessionId}/principals/{principalId}/revoke:
    post:
      operationId: revokeSessionPrincipal
      x-contract-id: session-onboarding-v1
      x-command-operation: principal.revoke
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: principalId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Guest or Display Principal access revoked. }
  /v1/sessions/{sessionId}/readiness:
    get:
      operationId: getSessionReadiness
      x-contract-id: readiness-v1
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: query, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200": { description: Current Release- and assignment-version-bound readiness., content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessProjectionV1" } } } }
        "403": { description: Administrative readiness is never returned to a Participant. }
  /v1/sessions/{sessionId}/readiness/{checkKey}/confirm:
    post:
      operationId: confirmSessionReadinessCheck
      x-contract-id: readiness-v1
      x-command-operation: readiness.confirm
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: checkKey, required: true, schema: { type: string, minLength: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Check confirmation pinned to current Release and assignment versions. }
  /v1/sessions/{sessionId}/ready:
    post:
      operationId: markSessionReady
      x-contract-id: readiness-v1
      x-command-operation: session.ready
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Session is ready only after every blocking current-version check passes. }
        "409": { description: Required readiness is incomplete or stale. }
  /v1/sessions/{sessionId}/open:
    post:
      operationId: openSession
      x-contract-id: readiness-v1
      x-command-operation: session.open
      x-authorized-session-operator: true
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "200": { description: Ready Session opened; Participants may join. }
        "409": { description: Session is not ready or current checks failed. }
  /v1/sessions/{sessionId}/sync/stream:
    get:
      operationId: streamRuntimeDeltas
      x-contract-id: runtime-sse-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Last-Event-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized at-least-once Runtime deltas; each SSE ID is an opaque Projection Cursor.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
        "409": { description: Projection Cursor expired or its access policy changed; fetch a snapshot. }
  /v1/sessions/{sessionId}/sync/deltas:
    get:
      operationId: getRuntimeDeltas
      x-contract-id: sync-deltas-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bounded ordered authorized deltas for restrictive-network polling fallback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDeltasV1" }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
        "409": { description: Projection Cursor expired or its access policy changed; fetch a snapshot. }
  /v1/sessions/{sessionId}/sync/snapshot:
    get:
      operationId: getRuntimeSnapshot
      x-contract-id: sync-snapshot-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Fresh authorized Runtime Projection with policy and projection versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncSnapshotV1" }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
  /v1/auth/oidc/{providerKey}/begin:
    post:
      operationId: beginOidcLogin
      security: []
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Server-created OIDC authorization request using state, nonce and PKCE.
  /v1/auth/oidc/{providerKey}/callback:
    get:
      operationId: completeOidcLogin
      x-contract-id: oidc-callback-v1
      security: []
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: code
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: state
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: Authentication Session established in a Secure, HttpOnly cookie. }
        "401": { description: Invalid or expired identity response. }
  /v1/sessions/{sessionId}/access-context:
    get:
      operationId: getSessionAccessContext
      x-contract-id: session-access-context-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Server-derived Session Access Context. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
components:
  schemas:
    ReleaseSummaryV1:
      type: object
      additionalProperties: false
      required: [id, project, label, releaseNumber, packageSchemaVersion, compilerVersion, packageDigest, publishedBy, publishedAt, approvalCount, sessionCount, immutable, detailUrl, packageUrl]
      properties:
        id: { type: string, format: uuid }
        project: { type: object, additionalProperties: false, required: [id, title], properties: { id: { type: string, format: uuid }, title: { type: string } } }
        label: { type: string }
        releaseNumber: { type: integer, minimum: 1 }
        packageSchemaVersion: { type: string }
        compilerVersion: { type: string }
        packageDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        publishedBy: { type: object, additionalProperties: false, required: [id, displayName], properties: { id: { type: string, format: uuid }, displayName: { type: string } } }
        publishedAt: { type: string, format: date-time }
        approvalCount: { type: integer, minimum: 0 }
        sessionCount: { type: integer, minimum: 0 }
        immutable: { const: true }
        detailUrl: { type: string }
        packageUrl: { type: string }
    ReleaseCatalogV1:
      type: object
      additionalProperties: false
      required: [contractId, permissions, releases, nextCursor]
      properties:
        contractId: { const: release-catalog-v1 }
        permissions:
          type: object
          additionalProperties: false
          required: [canExportPackage, canImportPackage, canCreateSession]
          properties:
            canExportPackage: { type: boolean }
            canImportPackage: { type: boolean }
            canCreateSession: { type: boolean }
        releases: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ReleaseSummaryV1" } }
        nextCursor: { type: [string, "null"] }
    SessionSummaryV1:
      type: object
      additionalProperties: false
      required: [id, title, project, governingRelease, status, version, scheduledStartAt, createdAt, updatedAt, participantCount, readiness, nextActions, urls]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        project: { type: object }
        governingRelease: { type: object }
        status: { type: string, enum: [created, configured, ready, open, active, paused, completed, locked, archived] }
        version: { type: integer, minimum: 1 }
        scheduledStartAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        participantCount: { type: integer, minimum: 0 }
        readiness: { type: object }
        nextActions: { type: array, items: { type: string } }
        urls: { type: object }
    SessionCatalogV1:
      type: object
      additionalProperties: false
      required: [contractId, permissions, sessions, nextCursor]
      properties:
        contractId: { const: session-catalog-v1 }
        permissions:
          type: object
          additionalProperties: false
          required: [canCreateSession, canOperateSessions]
          properties:
            canCreateSession: { type: boolean }
            canOperateSessions: { type: boolean }
        sessions: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/SessionSummaryV1" } }
        nextCursor: { type: [string, "null"] }
    CreatedConfiguredSessionV1:
      type: object
      additionalProperties: false
      required: [contractId, sessionId, title, status, version, governingReleaseId, scheduledStartAt, replayed, evidenceSequence, detailUrl, staffingUrl]
      properties:
        contractId: { const: session-catalog-v1 }
        sessionId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { const: configured }
        version: { const: 2 }
        governingReleaseId: { type: string, format: uuid }
        scheduledStartAt: { type: [string, "null"], format: date-time }
        replayed: { type: boolean }
        evidenceSequence: { type: integer, minimum: 1 }
        detailUrl: { type: string }
        staffingUrl: { type: string }
    ProjectLifecycleRequestV1:
      type: object
      additionalProperties: false
      required: [requestId, expectedVersion]
      properties:
        requestId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    ProjectMutationV1:
      type: object
      additionalProperties: false
      required: [projectId, lifecycleStatus, version, editorUrl, replayed]
      properties:
        projectId: { type: string, format: uuid }
        lifecycleStatus: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
        editorUrl: { type: string }
        replayed: { type: boolean }
    ProjectPortalV1:
      type: object
      additionalProperties: false
      required: [contractId, organization, availableOrganizations, permissions, projects, nextCursor]
      properties:
        contractId: { const: project-portal-v1 }
        organization: { type: object }
        availableOrganizations: { type: array, minItems: 1, maxItems: 1, items: { type: object } }
        permissions: { type: object }
        projects: { type: array, maxItems: 50, items: { type: object } }
        nextCursor: { type: [string, "null"] }
        members: { type: array, items: { type: object } }
    TemplateLibraryV1:
      type: object
      additionalProperties: false
      required: [contractId, templates, nextCursor]
      properties:
        contractId: { const: template-library-v1 }
        templates: { type: array, maxItems: 50, items: { type: object } }
        nextCursor: { type: [string, "null"] }
    StudioValidationReportV1:
      type: object
      additionalProperties: false
      required: [contractId, valid, issues, reportDigest]
      properties:
        contractId: { const: studio-validation-v1 }
        valid: { type: boolean }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, severity, message, path, elementId]
            properties:
              code: { type: string, minLength: 1 }
              severity: { type: string, enum: [error, warning] }
              message: { type: string, minLength: 1 }
              path: { type: string, minLength: 1 }
              elementId: { type: [string, "null"] }
        reportDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
    CollaborativeDraftV1:
      type: object
      additionalProperties: false
      required: [projectId, projectTitle, documentId, generation, update, stateVector, materialization, validation]
      properties:
        projectId: { type: string, format: uuid }
        projectTitle: { type: string, minLength: 1 }
        documentId: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        update: { type: string, contentEncoding: base64 }
        stateVector: { type: string, contentEncoding: base64 }
        materialization: { type: object }
        validation: { $ref: "#/components/schemas/StudioValidationReportV1" }
    StudioPublishRequestV1:
      type: object
      additionalProperties: false
      required: [releaseLabel, semanticVersion, methodologyVersion, releaseNotes, warningsAcknowledged, classificationReviewId, accessibilityReviewStatus, retentionPolicyId, approvalNotes]
      properties:
        freezeId: { type: string, format: uuid }
        releaseLabel: { type: string, minLength: 1, maxLength: 4000 }
        semanticVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        methodologyVersion: { type: string, minLength: 1, maxLength: 4000 }
        releaseNotes: { type: string, minLength: 1, maxLength: 4000 }
        warningsAcknowledged: { const: true }
        classificationReviewId: { type: string, minLength: 1, maxLength: 4000 }
        accessibilityReviewStatus: { type: string, minLength: 1, maxLength: 4000 }
        retentionPolicyId: { type: string, minLength: 1, maxLength: 4000 }
        approvalNotes: { type: string, minLength: 1, maxLength: 4000 }
    PublicationFreezeV1:
      type: object
      additionalProperties: false
      required: [freezeId, validation]
      properties:
        freezeId: { type: string, format: uuid }
        validation: { $ref: "#/components/schemas/StudioValidationReportV1" }
    PublicationReviewV1:
      type: object
      additionalProperties: false
      required: [freezeId, reviewerPersonId, decidedAt]
      properties:
        freezeId: { type: string, format: uuid }
        reviewerPersonId: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
    ResearchAccessGrantRequestV1:
      type: object
      additionalProperties: false
      required: [analystPersonId, protocolReference, expiresAt]
      properties:
        analystPersonId: { type: string, format: uuid }
        protocolReference: { type: string, minLength: 1, maxLength: 400 }
        expiresAt: { type: string, format: date-time }
    ResearchEvidenceIndexV1:
      type: object
      additionalProperties: false
      required: [contractId, sessionId, protocolReference, generatedAt, events, nextSequence]
      properties:
        contractId: { const: research-evidence-index-v1 }
        sessionId: { type: string, format: uuid }
        protocolReference: { type: string, minLength: 1 }
        generatedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sequence, eventType, eventVersion, governingReleaseId, recordedAt]
            properties:
              sequence: { type: integer, minimum: 1 }
              eventType: { type: string, minLength: 1 }
              eventVersion: { type: integer, minimum: 1 }
              governingReleaseId: { type: string, format: uuid }
              recordedAt: { type: string, format: date-time }
        nextSequence: { type: [integer, "null"], minimum: 1 }
    ReportDefinitionV1:
      type: object
      additionalProperties: false
      required: [contractId, definitionKey, definitionVersion, reportKind, includedDataClasses, excludedDataClasses, analyticalLayers]
      properties:
        contractId: { const: report-definition-v1 }
        definitionKey: { type: string, minLength: 1 }
        definitionVersion: { type: integer, minimum: 1 }
        reportKind: { type: string, enum: [session_archive, after_action, team, control, research_dataset, organization_archive] }
        includedDataClasses: { type: array, items: { type: string } }
        excludedDataClasses: { type: array, items: { type: string } }
        analyticalLayers: { type: array, items: { type: string, enum: [observation, derived_metric, analytical_note, finding] } }
    ResearchExportV1:
      type: object
      additionalProperties: false
      required: [contractId, exportId, projectId, sessionIds, releaseIds, generatedAt, exportDefinitionVersion, anonymizationProfile, purposeLabel, includedDataClasses, excludedDataClasses, reproducibilityManifests, observations, derivedMetrics, analyticalNotes, findings, provenance]
      properties:
        contractId: { const: research-export-v1 }
        exportId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        sessionIds: { type: array, items: { type: string, format: uuid } }
        releaseIds: { type: array, items: { type: string, format: uuid } }
        generatedAt: { type: string, format: date-time }
        exportDefinitionVersion: { type: integer, minimum: 1 }
        anonymizationProfile: { type: string }
        purposeLabel: { type: string }
        includedDataClasses: { type: array, items: { type: string } }
        excludedDataClasses: { type: array, items: { type: string } }
        reproducibilityManifests: { type: array, items: { type: object } }
        observations: { type: array, items: { type: object } }
        derivedMetrics: { type: array, items: { type: object } }
        analyticalNotes: { type: array, items: { type: object } }
        findings: { type: array, items: { type: object } }
        provenance: { type: object }
    ReplayDivergenceV1:
      type: object
      additionalProperties: false
      required: [contractId, sessionId, generatedAt, manifestDigest, matched, comparedEvents, divergences]
      properties:
        contractId: { const: replay-divergence-v1 }
        sessionId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        manifestDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        matched: { type: boolean }
        comparedEvents: { type: integer, minimum: 0 }
        divergences: { type: array, items: { type: object } }
    StudioPublishV1:
      type: object
      additionalProperties: false
      required: [contractId, freezeId, releaseId, definitionRevisionId, contentDigest, manifestDigest, packageDigest, saveState]
      properties:
        contractId: { const: studio-publish-v1 }
        freezeId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        definitionRevisionId: { type: string, format: uuid }
        contentDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        manifestDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        packageDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        saveState: { const: published }
    RolePreviewRequestV1:
      type: object
      additionalProperties: false
      required: [sessionRoleId, stageId]
      properties:
        sessionRoleId: { type: string, minLength: 1, maxLength: 200 }
        stageId: { type: string, minLength: 1, maxLength: 200 }
        teamId: { type: string, minLength: 1, maxLength: 200 }
    RolePreviewV1:
      type: object
      additionalProperties: false
