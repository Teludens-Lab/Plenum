openapi: 3.1.0
info:
  title: Plenum platform API
  version: 0.1.0
paths:
  /v1/plugins/submissions:
    post:
      operationId: submitPluginArtifact
      x-contract-ids: [plugin-manifest-v1, offline-plugin-bundle-v1]
      x-authorized-organization-role: publisher
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Signed Plugin Artifact accepted into contract-validated lifecycle state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginArtifactV1" }
        "403": { description: Publisher is not approved or its authority was revoked. }
        "422": { description: Manifest, signature, digest closure, SBOM, vulnerability, or contract validation failed. }
  /v1/plugins/{artifactId}/approve:
    post:
      operationId: approvePluginArtifact
      x-contract-id: plugin-registry-v1
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Artifact approved by a person other than its submitter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginArtifactV1" }
        "403": { description: Admin authority or separation of duties is absent. }
        "409": { description: Artifact is not in a valid approval state. }
  /v1/plugins/offline-imports:
    post:
      operationId: importOfflinePluginBundle
      x-contract-ids: [plugin-manifest-v1, offline-plugin-bundle-v1, plugin-registry-v1]
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Offline bundle verified into contract-validated state; separate Artifact approval and Installation are still required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginArtifactV1" }
        "403": { description: Admin authority, institution trust root, or license acceptance is absent. }
        "409": { description: Deployment profile or compatibility range is incompatible. }
        "422": { description: Signature, digest closure, revocation freshness, SBOM, or vulnerability validation failed. }
  /v1/organizations/{organizationId}/plugin-installations:
    post:
      operationId: installPluginArtifact
      x-contract-ids: [plugin-registry-v1, offline-plugin-bundle-v1]
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: organizationId
          required: true
          description: Must equal the Organization derived from the authenticated server context.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginInstallationRequestV1" }
      responses:
        "201": { description: Verified Plugin Artifact installed and enabled for one Deployment. }
        "403": { description: Admin authority, trust root, approval, or license acceptance is absent. }
        "409": { description: Host, Release schema, or deployment profile is incompatible. }
        "422": { description: Signature, digest closure, revocation freshness, SBOM, or vulnerability validation failed. }
  /v1/organizations/{organizationId}/plugin-catalog:
    get:
      operationId: getPluginCatalog
      x-contract-id: plugin-registry-v1
      x-authorized-organization-roles: [admin, designer, publisher]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Organization-scoped curated Plugin catalog; Participant access is denied server-side. }
        "403": { description: Required Organization Role is absent. }
  /v1/projects/{projectId}/plugin-bindings:
    post:
      operationId: bindPluginInstallation
      x-contract-id: plugin-registry-v1
      x-authorized-organization-roles: [admin, designer]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginBindingRequestV1" }
      responses:
        "201": { description: Enabled installation bound by immutable Artifact and configuration digests. }
        "403": { description: Binding authority or Plugin approval is absent. }
        "409": { description: Deployment profile or Release schema is incompatible. }
  /v1/projects/{projectId}/releases:
    post:
      operationId: publishRelease
      x-contract-id: release-manifest-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishReleaseRequestV1" }
      responses:
        "201":
          description: Immutable Definition Revision, Release, and portable Package created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedReleaseV1" }
        "403": { description: Publisher authority is absent or revoked. }
        "409": { description: Draft changed or identical content was already published. }
  /v1/releases/{releaseId}/package:
    get:
      operationId: exportReleasePackage
      x-contract-id: package-import-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Canonical Package bytes verified against the stored digest.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Release is absent from the authenticated Organization. }
  /v1/packages/import:
    post:
      operationId: importReleasePackage
      x-contract-id: package-import-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: header
          name: X-Package-SHA256
          required: true
          schema: { type: string, pattern: "^sha-256=[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Verified Package imported or matched idempotently to its existing Release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedReleaseV1" }
        "400": { description: Package digest or compatibility verification failed. }
        "403": { description: Publisher authority is absent or revoked. }
  /v1/sessions/{sessionId}/commands:
    post:
      operationId: processSessionCommand
      x-contract-ids: [artifact-command-v1, stage-command-v1, inject-command-v1, message-command-v1, approval-decision-v1, poll-command-v1, ballot-command-v1, certification-v1]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandEnvelopeV1" }
      responses:
        "200":
          description: Accepted or idempotently replayed recorded outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceiptV1" }
        "409":
          description: Rejected or reconciliation-required recorded outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceiptV1" }
        "503": { description: Deployment or Authority Epoch is not authoritative; no receipt is written. }
  /v1/sessions/{sessionId}/commands/{commandId}:
    get:
      operationId: getCommandReceipt
      x-contract-id: command-receipt-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: commandId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's original durable Command Receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceiptV1" }
        "404": { description: Missing and unauthorized receipts share NOT_FOUND semantics. }
  /v1/sessions/{sessionId}/effect-proposals:
    get:
      operationId: getEffectProposals
      x-contract-id: effect-proposal-v1
      description: Returns only proposals reviewable by the trusted active Session Role. Approval is never queued offline.
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tenant-, Session-, and role-scoped Effect Proposals.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [proposals]
                properties:
                  proposals: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/EffectProposalV1" } }
        "403": { description: Current Participant, Device, or active Session Role is unavailable. }
  /v1/sessions/{sessionId}/extension-provenance:
    get:
      operationId: exportExtensionProvenance
      x-contract-ids: [model-run-v1, effect-proposal-v1, approval-decision-v1]
      x-authorized-organization-role: operator
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Complete run-to-effect provenance retained independently of Plugin lifecycle. }
        "403": { description: Operator authority is absent. }
  /v1/devices:
    post:
      operationId: registerDevice
      security: [{ SessionCookie: [] }]
      responses:
        "201":
          description: A Device registered to the authenticated Person.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deviceId]
                properties:
                  deviceId: { type: string, format: uuid }
  /v1/sessions/{sessionId}/runtime-projection:
    get:
      operationId: getRuntimeInterfaceProjection
      x-contract-id: runtime-projection-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Device-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Release-driven, server-authorized Runtime interface and task projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeProjectionV1" }
        "403": { description: Participant, Device, Seat Assignment, or Interface Profile is not authorized. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
  /v1/sessions/{sessionId}/polls:
    get:
      operationId: getPolls
      x-contract-ids: [poll-command-v1, ballot-command-v1, certification-v1]
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Device-ID, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Poll projections scoped to the trusted Participant and active Seat Assignment.
          content: { application/json: { schema: { type: object, required: [polls], properties: { polls: { type: array, items: { $ref: "#/components/schemas/RuntimePollV1" } } } } } }
        "403": { description: Participant, Device, or active Session Role is unavailable. }
  /v1/sessions/{sessionId}/polls/{pollId}:
    get:
      operationId: getPoll
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: pollId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Device-ID, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Participant-scoped Poll projection., content: { application/json: { schema: { $ref: "#/components/schemas/RuntimePollV1" } } } }
        "404": { description: Poll is absent from the authorized Session projection. }
  /v1/sessions/{sessionId}/polls/{pollId}/my-receipt:
    get:
      operationId: getMyBallotReceipt
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: pollId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Device-ID, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The caller's current Ballot receipt; choices are omitted. }
        "404": { description: No current receipt exists for the trusted Seat Assignment. }
  /v1/sessions/{sessionId}/polls/{pollId}/result:
    get:
      operationId: getPollResult
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: pollId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Device-ID, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Certified result allowed by the frozen result visibility policy. }
        "403": { description: RESULT_NOT_RELEASED before Certification or when visibility policy denies access. }
  /v1/sessions/{sessionId}/polls/{pollId}/audit:
    get:
      operationId: getPollAudit
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: pollId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Device-ID, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Restricted definition, Tally hashes, and Certification correction chain; Ballot choices and voter identities are omitted. }
        "403": { description: Certification permission is absent. }
  /v1/operator/sessions/{sessionId}:
    get:
      operationId: getOperatorProjection
      x-contract-id: operator-projection-v1
      x-authorized-organization-role: operator
      x-operator-display-label: Game Master
      x-authorization-scope: [organization, session]
      x-participant-seat: forbidden
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authoritative Session summary for an Organization Operator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorProjectionV1" }
        "403": { description: The authenticated Principal is not an Operator. }
  /v1/sessions/{sessionId}/sync/stream:
    get:
      operationId: streamRuntimeDeltas
      x-contract-id: runtime-sse-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Last-Event-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized at-least-once Runtime deltas; each SSE ID is an opaque Projection Cursor.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
        "409": { description: Projection Cursor expired or its access policy changed; fetch a snapshot. }
  /v1/sessions/{sessionId}/sync/deltas:
    get:
      operationId: getRuntimeDeltas
      x-contract-id: sync-deltas-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bounded ordered authorized deltas for restrictive-network polling fallback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDeltasV1" }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
        "409": { description: Projection Cursor expired or its access policy changed; fetch a snapshot. }
  /v1/sessions/{sessionId}/sync/snapshot:
    get:
      operationId: getRuntimeSnapshot
      x-contract-id: sync-snapshot-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Fresh authorized Runtime Projection with policy and projection versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncSnapshotV1" }
        "401": { description: Authentication Session expired or was revoked. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
  /v1/auth/oidc/{providerKey}/begin:
    post:
      operationId: beginOidcLogin
      security: []
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Server-created OIDC authorization request using state, nonce and PKCE.
  /v1/auth/oidc/{providerKey}/callback:
    get:
      operationId: completeOidcLogin
      x-contract-id: oidc-callback-v1
      security: []
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: code
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: state
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: Authentication Session established in a Secure, HttpOnly cookie. }
        "401": { description: Invalid or expired identity response. }
  /v1/sessions/{sessionId}/access-context:
    get:
      operationId: getSessionAccessContext
      x-contract-id: session-access-context-v1
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Server-derived Session Access Context. }
        "404": { description: Missing and unauthorized Sessions share TARGET_NOT_FOUND semantics. }
components:
  schemas:
    PluginArtifactV1:
      type: object
      additionalProperties: false
      required: [artifactId, pluginId, version, digest, lifecycleStatus]
      properties:
        artifactId: { type: string, format: uuid }
        pluginId: { type: string, pattern: "^[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9_-]*){2,}$" }
        version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        lifecycleStatus: { type: string, enum: [contract_validated, approved, rejected, suspended, revoked, deprecated, quarantined] }
    PluginInstallationRequestV1:
      type: object
      additionalProperties: false
      required: [installationId, deploymentId, artifactId, permittedPermissions, hostApiVersion, releaseSchemaVersion, deploymentProfile]
      properties:
        installationId: { type: string, format: uuid }
        deploymentId: { type: string, format: uuid }
        artifactId: { type: string, format: uuid }
        permittedPermissions: { type: array, uniqueItems: true, items: { type: string } }
        hostApiVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        releaseSchemaVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        deploymentProfile: { type: string, enum: [connected, self_hosted, air_gapped] }
    PluginBindingRequestV1:
      type: object
      additionalProperties: false
      required: [bindingId, definitionRevisionId, installationId, configurationDigest, hostApiVersion, releaseSchemaVersion, deploymentProfile]
      properties:
        bindingId: { type: string, format: uuid }
        definitionRevisionId: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        configurationDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        hostApiVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        releaseSchemaVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        deploymentProfile: { type: string, enum: [connected, self_hosted, air_gapped] }
    PublishReleaseRequestV1:
      type: object
      additionalProperties: false
      required: [releaseLabel, semanticVersion, methodologyVersion, releaseNotes, controls]
      properties:
        releaseLabel: { type: string, minLength: 1 }
        semanticVersion: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$" }
        methodologyVersion: { type: string, minLength: 1 }
        releaseNotes: { type: string }
        controls:
          type: object
          additionalProperties: false
          required: [validationReportId, validationPassed, warningsAcknowledged, classificationReviewId, accessibilityReviewStatus, retentionPolicyId, approvedBy, approvalNotes]
          properties:
            validationReportId: { type: string, format: uuid }
            validationPassed: { const: true }
            warningsAcknowledged: { const: true }
            classificationReviewId: { type: string, minLength: 1 }
            accessibilityReviewStatus: { type: string, minLength: 1 }
            retentionPolicyId: { type: string, minLength: 1 }
            approvedBy: { type: array, minItems: 1, items: { type: string, format: uuid } }
            approvalNotes: { type: string }
            testSessionPassed: { type: boolean }
    PublishedReleaseV1:
      type: object
      additionalProperties: false
      required: [releaseId, definitionRevisionId, releaseLabel, contentDigest, manifestDigest, packageDigest]
      properties:
        releaseId: { type: string, format: uuid }
        definitionRevisionId: { type: string, format: uuid }
        releaseLabel: { type: string }
        contentDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        manifestDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        packageDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        imported: { type: boolean }
    CommandEnvelopeV1:
      type: object
      additionalProperties: false
      required: [commandId, deviceId, operationType, aggregateId, expectedAggregateVersion, governingReleaseId, payload]
      properties:
        commandId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        operationType: { type: string, pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$" }
        aggregateId: { type: string, format: uuid }
        expectedAggregateVersion: { type: integer, minimum: 0 }
        governingReleaseId: { type: string, format: uuid }
        activeSessionRoleId: { type: string, minLength: 1 }
        deviceObservedAt: { type: string, format: date-time }
        payload: { type: object }
    CommandReceiptV1:
      type: object
      additionalProperties: false
      required: [commandId, status, aggregateVersion, evidenceSequence, errorCode, message, replayed]
      properties:
        commandId: { type: string, format: uuid }
        status: { type: string, enum: [received, accepted, rejected, needs_reconciliation] }
        aggregateVersion: { type: [integer, "null"], minimum: 0 }
        evidenceSequence: { type: [integer, "null"], minimum: 1 }
        errorCode: { type: [string, "null"] }
        message: { type: [string, "null"] }
        replayed: { type: boolean }
    RuntimeFormFieldV1:
      type: object
      additionalProperties: false
      required: [key, label, type, required]
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        type: { type: string, enum: [text, long_text, number, single_select, multi_select] }
        required: { type: boolean }
        requiredWhen: { type: object }
        visibleWhen: { type: object }
        helpText: { type: string }
        validation: { type: object }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    RuntimeFormV1:
      type: object
      additionalProperties: false
      required: [id, name, formVersion, fields, sections]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        formVersion: { type: string, minLength: 1 }
        fields: { type: array, items: { $ref: "#/components/schemas/RuntimeFormFieldV1" } }
        sections:
          type: array
          items:
            type: object
            required: [id, fields]
            properties:
              id: { type: string, minLength: 1 }
              title: { type: string }
              fields: { type: array, items: { $ref: "#/components/schemas/RuntimeFormFieldV1" } }
        rules: { type: array, items: { type: object } }
    RuntimeActionV1:
      type: object
      additionalProperties: false
      required: [operationType, label, requiresForm]
      properties:
        operationType: { type: string, pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$" }
