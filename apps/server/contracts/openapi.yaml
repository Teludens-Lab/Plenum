openapi: 3.1.0
info:
  title: Plenum platform API
  version: 0.1.0
paths:
  /v1/projects:
    get:
      operationId: listProjectPortal
      x-contract-id: project-portal-v1
      x-authorized-organization-roles: [admin, designer, publisher, reviewer]
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 100 } }
        - { in: query, name: status, schema: { type: string, enum: [active, archived, all], default: active } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200": { description: Organization-scoped Project page and least-privilege member view, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPortalV1" } } } }
        "403": { description: Current Organization Membership lacks a portal role or was revoked. }
    post:
      operationId: createProject
      x-contract-id: project-portal-v1
      x-authorized-organization-roles: [admin, designer]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, title]
              properties:
                requestId: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 200 }
                templateId: { type: string, format: uuid }
                includeScenario: { type: boolean, default: false }
      responses:
        "201": { description: Project and Draft created atomically; replay returns the original result, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMutationV1" } } } }
        "403": { description: Designer or Admin authority is absent or revoked. }
        "409": { description: Request ID was reused with different input. }
        "422": { description: Project or Template input is invalid. }
  /v1/templates:
    get:
      operationId: listSimulationTemplates
      x-contract-id: template-library-v1
      x-authorized-organization-roles: [admin, designer, publisher, reviewer]
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 100 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200": { description: Organization-scoped Simulation Template page, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateLibraryV1" } } } }
        "403": { description: Current Organization Membership lacks a portal role or was revoked. }
  /v1/projects/{projectId}/archive:
    post:
      operationId: archiveProject
      x-contract-id: project-portal-v1
      x-authorized-organization-roles: [admin, designer]
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: projectId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectLifecycleRequestV1" } } } }
      responses:
        "200": { description: Project archived without changing Releases, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMutationV1" } } } }
        "409": { description: Stale version, invalid transition, or idempotency collision. }
  /v1/projects/{projectId}/reopen:
    post:
      operationId: reopenProject
      x-contract-id: project-portal-v1
      x-authorized-organization-roles: [admin, designer]
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: projectId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectLifecycleRequestV1" } } } }
      responses:
        "200": { description: Archived Project reopened, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMutationV1" } } } }
        "409": { description: Stale version, invalid transition, or idempotency collision. }
  /v1/projects/{projectId}/collaboration:
    get:
      operationId: connectStudioCollaboration
      x-websocket: true
      x-contract-id: studio-crdt-v1
      x-authorized-organization-role: designer
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "101": { description: Authenticated CRDT stream; access is rechecked for every accepted update and broadcast. }
        "401": { description: Authentication Session is invalid, expired, or revoked. }
        "403": { description: Designer authority is absent. }
  /v1/projects/{projectId}/draft:
    get:
      operationId: getCollaborativeDraft
      x-contract-id: studio-crdt-v1
      x-authorized-organization-roles: [designer, publisher, reviewer]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authoritative CRDT snapshot, state vector, deterministic materialization and validation report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborativeDraftV1" }
        "403": { description: Studio authority is absent or was revoked. }
  /v1/projects/{projectId}/validate:
    post:
      operationId: validateCollaborativeDraft
      x-contract-id: studio-validation-v1
      x-authorized-organization-roles: [designer, publisher, reviewer]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Current merged Draft is valid. }
        "422": { description: Current merged Draft has actionable validation issues. }
  /v1/projects/{projectId}/role-preview:
    post:
      operationId: previewDraftAsRole
      x-contract-id: role-preview-v1
      x-authorized-organization-roles: [designer, publisher, reviewer]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolePreviewRequestV1" }
      responses:
        "200":
          description: Server-filtered Runtime interface and Scenario content for the selected Draft role and Stage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolePreviewV1" }
        "403": { description: Studio authority is absent or was revoked. }
        "422": { description: Role, Stage, Team, or Interface Profile selection is invalid. }
  /v1/projects/{projectId}/publish:
    post:
      operationId: freezeAndPublishCollaborativeDraft
      x-contract-id: studio-publish-v1
      x-authorized-organization-role: publisher
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudioPublishRequestV1" }
      responses:
        "201":
          description: Reviewer-approved frozen state published as an immutable Definition Revision and Release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioPublishV1" }
        "403": { description: Publisher authority or a current Reviewer approval is absent or was revoked. }
        "422": { description: Validation or publication controls failed. }
  /v1/projects/{projectId}/publication-freezes:
    post:
      operationId: freezeCollaborativeDraftForReview
      x-contract-id: studio-validation-v1
      x-authorized-organization-role: publisher
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Exact validated state vector frozen for methodology review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationFreezeV1" }
        "403": { description: Publisher authority is absent or revoked. }
        "422": { description: The Draft has validation errors. }
  /v1/projects/{projectId}/publication-freezes/{freezeId}/approve:
    post:
      operationId: approvePublicationFreeze
      x-authorized-organization-role: reviewer
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: freezeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notes]
              properties:
                notes: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Immutable Reviewer approval recorded for the exact freeze.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationReviewV1" }
        "403": { description: Reviewer authority is absent or revoked. }
        "404": { description: Freeze is outside the authenticated Organization or project. }
  /v1/projects/{projectId}/research-access-grants:
    post:
      operationId: grantResearchEvidenceAccess
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchAccessGrantRequestV1" }
      responses:
        "201": { description: Time-bounded project and protocol Research Access Grant created. }
        "403": { description: Admin authority is absent or revoked. }
        "422": { description: Analyst membership, protocol, or expiry is invalid. }
  /v1/research-access-grants/{grantId}:
    delete:
      operationId: revokeResearchEvidenceAccess
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: grantId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Research Access Grant revoked and audited. }
        "403": { description: Admin authority is absent or revoked. }
        "404": { description: Active grant is outside the authenticated Organization or absent. }
  /v1/sessions/{sessionId}/research-evidence-index:
    get:
      operationId: exportResearchEvidenceIndex
      x-contract-id: research-evidence-index-v1
      x-authorized-organization-role: research_analyst
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: afterSequence
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        "200":
          description: Protocol-scoped, PII-free Evidence Event index; event bodies and actor identifiers are excluded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchEvidenceIndexV1" }
        "403": { description: Research Analyst authority or an active project grant is absent. }
  /v1/projects/{projectId}/research-export:
    get:
      operationId: exportProjectResearchEvidence
      x-contract-id: research-evidence-manifest-v1
      x-authorized-organization-role: research_analyst
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: projectId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: format, schema: { type: string, enum: [json, csv, html, zip], default: zip } }
      responses:
        "200":
          description: Project-scoped PII-free canonical Evidence export with captured-row labels, hashes and source reconciliation.
          content:
            application/json: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string, format: binary } }
            text/html: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        "403": { description: Research Analyst authority or an active project grant is absent. }
  /v1/sessions/{sessionId}/research-consents:
    post:
      operationId: recordResearchConsent
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purposeLabel, consentVersion, decision]
              properties:
                purposeLabel: { type: string, minLength: 1, maxLength: 400 }
                consentVersion: { type: string, minLength: 1, maxLength: 100 }
                decision: { type: string, enum: [granted, withdrawn] }
      responses:
        "201": { description: Append-only research consent decision recorded and audited. }
        "403": { description: Current Session participation is absent. }
  /v1/sessions/{sessionId}/reports:
    post:
      operationId: generateSessionReport
      x-contract-ids: [report-definition-v1, research-export-v1]
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, reportKind, format]
              properties:
                idempotencyKey: { type: string, format: uuid }
                reportKind: { type: string, enum: [session_archive, after_action, team, control, research_dataset] }
                format: { type: string, enum: [json, jsonl, csv, html, pdf, zip] }
                purposeLabel: { type: string, minLength: 1, maxLength: 400 }
      responses:
        "200": { description: Immutable generated artifact; a retry returns the original artifact. }
        "403": { description: Current role, Research Access Grant, or consent scope is insufficient. }
        "404": { description: The original generated artifact expired under the approved retention policy. }
        "409": { description: Idempotency key collision. }
  /v1/sessions/{sessionId}/replay:
    post:
      operationId: replaySession
      x-contract-id: replay-divergence-v1
      x-authorized-organization-roles: [admin, operator]
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deterministic replay comparison or machine-readable divergence report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayDivergenceV1" }
        "409": { description: Replay adapter is not configured. }
  /v1/retention/legal-holds:
    post:
      operationId: placeLegalHold
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopeType, scopeReference, reason]
              properties:
                scopeType: { type: string, enum: [organization, export] }
                scopeReference: { type: string, minLength: 1, maxLength: 200 }
                reason: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201": { description: Append-only legal hold placement and Audit Record created atomically. }
        "403": { description: Current Admin authority is absent or revoked. }
        "422": { description: Legal hold scope or reason is invalid. }
  /v1/retention/legal-holds/{holdId}/release:
    post:
      operationId: releaseLegalHold
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: holdId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201": { description: Append-only legal hold release and Audit Record created atomically. }
        "403": { description: Current Admin authority is absent or revoked. }
        "404": { description: Legal hold is not found in the current Organization. }
        "409": { description: Legal hold was already released. }
  /v1/plugins/submissions:
    post:
      operationId: submitPluginArtifact
      x-contract-ids: [plugin-manifest-v1, offline-plugin-bundle-v1]
      x-authorized-organization-role: publisher
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Signed Plugin Artifact accepted into contract-validated lifecycle state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginArtifactV1" }
        "403": { description: Publisher is not approved or its authority was revoked. }
        "422": { description: Manifest, signature, digest closure, SBOM, vulnerability, or contract validation failed. }
  /v1/plugins/{artifactId}/approve:
    post:
      operationId: approvePluginArtifact
      x-contract-id: plugin-registry-v1
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Artifact approved by a person other than its submitter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginArtifactV1" }
        "403": { description: Admin authority or separation of duties is absent. }
        "409": { description: Artifact is not in a valid approval state. }
  /v1/plugins/offline-imports:
    post:
      operationId: importOfflinePluginBundle
      x-contract-ids: [plugin-manifest-v1, offline-plugin-bundle-v1, plugin-registry-v1]
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Offline bundle verified into contract-validated state; separate Artifact approval and Installation are still required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginArtifactV1" }
        "403": { description: Admin authority, institution trust root, or license acceptance is absent. }
        "409": { description: Deployment profile or compatibility range is incompatible. }
        "422": { description: Signature, digest closure, revocation freshness, SBOM, or vulnerability validation failed. }
  /v1/organizations/{organizationId}/plugin-installations:
    post:
      operationId: installPluginArtifact
      x-contract-ids: [plugin-registry-v1, offline-plugin-bundle-v1]
      x-authorized-organization-role: admin
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: organizationId
          required: true
          description: Must equal the Organization derived from the authenticated server context.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginInstallationRequestV1" }
      responses:
        "201": { description: Verified Plugin Artifact installed and enabled for one Deployment. }
        "403": { description: Admin authority, trust root, approval, or license acceptance is absent. }
        "409": { description: Host, Release schema, or deployment profile is incompatible. }
        "422": { description: Signature, digest closure, revocation freshness, SBOM, or vulnerability validation failed. }
  /v1/organizations/{organizationId}/plugin-catalog:
    get:
      operationId: getPluginCatalog
      x-contract-id: plugin-registry-v1
      x-authorized-organization-roles: [admin, designer, publisher]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Organization-scoped curated Plugin catalog; Participant access is denied server-side.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginCatalogV1" }
        "403": { description: Required Organization Role is absent. }
  /v1/projects/{projectId}/plugin-catalog:
    get:
      operationId: getProjectPluginCatalog
      x-contract-id: plugin-registry-v1
      x-authorized-organization-roles: [admin, designer, publisher]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Approved installed Plugins available to this Organization-owned Simulation Project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginCatalogV1" }
        "403": { description: Required Organization Role is absent. }
        "404": { description: Project is outside the authenticated Organization or does not exist. }
  /v1/projects/{projectId}/plugin-bindings:
    post:
      operationId: bindPluginInstallation
      x-contract-id: plugin-registry-v1
      x-authorized-organization-roles: [admin, designer]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginBindingRequestV1" }
      responses:
        "201": { description: Enabled installation bound by immutable Artifact and configuration digests. }
        "403": { description: Binding authority or Plugin approval is absent. }
        "409": { description: Deployment profile or Release schema is incompatible. }
  /v1/projects/{projectId}/compositions/validate:
    post:
      operationId: previewModelCompositionFixture
      x-contract-ids: [composition-definition-v1, plugin-binding-v1]
      x-authorized-organization-roles: [admin, designer, publisher]
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [compositionId, fixtureId]
              properties:
                compositionId: { type: string, format: uuid }
                fixtureId: { type: string, format: uuid }
      responses:
        "200": { description: Typed graph compiled and fixture routing previewed without Session state change. }
        "403": { description: Studio authority is absent or revoked. }
        "422": { description: Graph, fixture, type, unit, classification, cycle, or approval validation failed. }
  /v1/releases:
    get:
      operationId: listReleaseCatalog
      x-contract-id: release-catalog-v1
      x-authorized-organization-roles: [admin, publisher, operator]
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 100 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200": { description: Tenant-scoped immutable Release catalog., content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseCatalogV1" } } } }
        "403": { description: Current Membership has no Release catalog authority. }
  /v1/releases/import:
    post:
      operationId: importCatalogReleasePackage
      x-contract-ids: [release-catalog-v1, package-import-v1]
      x-authorized-organization-role: publisher
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/vnd.plenum.release+json:
            schema: { type: string, format: binary, maxLength: 32000000 }
      responses:
        "201": { description: Package bytes verified and imported or matched idempotently. }
        "400": { description: Package bytes, digest, schema, or compatibility are invalid. }
        "403": { description: Publisher authority is absent or revoked. }
  /v1/releases/{releaseId}:
    get:
      operationId: getReleaseCatalogItem
      x-contract-id: release-catalog-v1
      x-authorized-organization-roles: [admin, publisher, operator]
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: releaseId, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Immutable Release detail., content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseSummaryV1" } } } }
        "404": { description: Release is absent from the authenticated Organization. }
  /v1/releases/{releaseId}/sessions:
    post:
      operationId: createConfiguredSessionFromRelease
      x-contract-id: session-catalog-v1
      x-command-operation: session.create
      x-authorized-organization-role: operator
      security: [{ SessionCookie: [] }]
      parameters: [{ in: path, name: releaseId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandEnvelopeV1" } } } }
      responses:
        "201": { description: Session creation, configuration, Receipt, Evidence and outbox committed atomically., content: { application/json: { schema: { $ref: "#/components/schemas/CreatedConfiguredSessionV1" } } } }
        "403": { description: Current Membership has no Operator authority. }
        "409": { description: Command is a collision or the Session identity already exists. }
  /v1/sessions:
    get:
      operationId: listSessionCatalog
      x-contract-id: session-catalog-v1
      x-authorized-organization-roles: [admin, operator]
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 100 } }
        - { in: query, name: status, schema: { type: string, enum: [all, created, configured, ready, open, active, paused, completed, locked, archived], default: all } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
