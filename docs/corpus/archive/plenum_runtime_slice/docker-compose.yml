services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: plenum_owner
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: plenum
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U plenum_owner -d plenum']
      interval: 3s
      retries: 15
